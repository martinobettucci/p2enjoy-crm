# @spec CRM-001 (docs/BACKLOG.md) — overlay de production de la pile Supabase self-hosted
# @spec CRM-016 (docs/BACKLOG.md), docs/SPEC-edge-functions.md §2, §8 — runtime edge commun
# @spec docs/DAT.md §3.5 (passerelle et périphérie), §9 (déploiement)
# @spec docs/PROD_MIGRATIONS.md §2 (prérequis), §4 (services à redéployer)
# @spec CRM-092 (docs/BACKLOG.md), docs/SPEC-session-sso.md §2, §12 — tranche T6 : GoTrue n'est plus
#       redémarré ici, il a quitté la pile (docs/JOURNAL.md décision 589) ; tranche T7 : label de
#       révision des routes de Caddy (décision 591, docs/SPEC-deploiement-spark.md §5.1)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Aucun service de développement n'est déclaré ici, et aucun n'est hérité : Studio, MinIO,
# Keycloak et postgres-meta n'existent que dans `docker-compose.dev.yml`. Cet assemblage est
# vérifié par `scripts/verify-stack.sh`, qui échoue si l'un d'eux réapparaît.
#
# Seul Caddy est joignable depuis l'extérieur. Kong ne publie plus aucun port : il n'est atteint
# que par le réseau interne de la pile. Aucun accès PostgreSQL n'est publié, ni direct, ni poolé
# — le pooler a été retiré de la pile par la décision 366.

services:

  # @spec CRM-115 (docs/BACKLOG.md) T2, docs/SPEC-pile-par-session.md §6 bis ; docs/JOURNAL.md décision 702 (option A) —
  # LA PRODUCTION GARDE SES NOMS. Le développement ne nomme plus aucun conteneur : Compose les dérive du projet, pour
  # que deux piles coexistent. Une production n'a qu'une pile, et `scripts/spark/verifier.sh` comme les gestes de
  # `docs/PROD_MIGRATIONS.md` la désignent par ces noms : ils sont posés ici, et la cellule les hérite.
  migrations-runner:
    container_name: p2enjoy-migrations

  db:
    container_name: p2enjoy-db
    restart: always

  rest:
    container_name: p2enjoy-rest
    restart: always

  realtime:
    container_name: realtime-dev.p2enjoy-realtime
    restart: always

  functions:
    container_name: p2enjoy-functions
    restart: always

  # `mail-sync` est déclaré dans l'assemblage commun : la production exécute la même image, sans
  # port publié, et son profil rend `404` les routes de preuve (docs/SPEC-mail-subsystem.md §12.3).
  mail-sync:
    container_name: p2enjoy-mail-sync
    restart: always

  # @spec CRM-102 (docs/BACKLOG.md), docs/SPEC-mcp.md §2.1, §10 — actif seulement sous le profil `mcp` (compose_prod) ;
  # son origine publique est dérivée de l'hôte posé, jamais saisie.
  mcp:
    container_name: p2enjoy-mcp
    restart: always
    environment:
      CRM_MCP_ORIGINE_PUBLIQUE: https://${CRM_MCP_HOTE:-mcp.invalid}

  # Le stockage vise le fournisseur S3 réel, décrit par les variables d'environnement de
  # production (docs/PROD_MIGRATIONS.md §2.3). Aucune valeur n'est codée en dur ici.
  storage:
    container_name: p2enjoy-storage
    restart: always

  # La passerelle n'est plus publiée : Caddy la joint par le réseau interne et termine TLS.
  kong:
    container_name: p2enjoy-kong
    restart: always
    ports: !reset []

  # --- Périphérie ----------------------------------------------------------------------------

  # Caddy termine TLS et sert la webapp buildée (docs/DAT.md §3.5).
  # `webapp/dist` est produit par `npm run build` (README.md §8) ; tant que l'unité `CRM-007`
  # n'est pas livrée, le répertoire est vide et Caddy ne sert que l'API.
  caddy:
    container_name: p2enjoy-caddy
    image: caddy:2.9-alpine
    restart: always
    # Révision des routes, sur le modèle de Kong (docs/SPEC-edge-functions.md §2) : Caddy ne relit pas
    # `routes.caddy`, et la livraison remplace le fichier sous le conteneur en service. Changer ce label
    # dans le même changement que les routes fait recréer Caddy par le `up` ordinaire. `crm-092` :
    # `/auth/v1/*` répond 404 (docs/JOURNAL.md décision 589). `crm-102` : l'hôte du connecteur MCP est aiguillé
    # vers `mcp` avant toute autre route (docs/SPEC-mcp.md §2.2). `crm-001` : Caddy ferme une connexion amont
    # inactive après 3 s, avant Kong et `mcp` (docs/DAT.md §3.5 bis, INC-299, décision 696).
    labels:
      com.p2enjoy.caddy-routes-revision: crm-001
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      # Routes partagées avec le Caddyfile de la cellule Spark (CRM-090, décision 567).
      - ./caddy/routes.caddy:/etc/caddy/routes.caddy:ro,z
      - ./webapp/dist:/srv/www:ro,z
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      # @spec CRM-102 (docs/BACKLOG.md), docs/SPEC-mcp.md §2.2 — dérivées de la seule `CRM_MCP_HOTE` : le matcher
      # reçoit `mcp.invalid` à défaut (jamais vide), la liste d'adresses la valeur nue. Aucun secret.
      MCP_HOTE: ${CRM_MCP_HOTE:-mcp.invalid}
      MCP_SITE: ${CRM_MCP_HOTE:-}
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
