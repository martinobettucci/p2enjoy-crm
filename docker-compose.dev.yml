# @spec CRM-001 (docs/BACKLOG.md) — overlay de développement de la pile Supabase self-hosted
# @spec docs/DAT.md §3.6 (composants de développement uniquement), §9 (déploiement)
# @spec README.md §6 (lancement en développement)
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Tout ce qui figure ici est **exclusivement** destiné au développement et ne doit jamais se
# retrouver dans l'assemblage de production (docs/DAT.md §3.6). Les ports ne sont publiés que
# sur l'interface de bouclage : la pile de développement n'est pas destinée à être exposée.

services:

  # Base recréable à volonté en développement : pas de redémarrage automatique, et accès SQL
  # direct depuis l'hôte pour pgTAP et l'outillage de migration (CRM-003, CRM-008).
  db:
    restart: "no"
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_DIRECT_PORT}:${POSTGRES_PORT}

  # Les emails transactionnels partent vers Inbucket, jamais vers l'extérieur.
  auth:
    depends_on:
      db:
        condition: service_healthy
      inbucket:
        condition: service_started

  # Le stockage vise le MinIO local ; aucun compte S3 réel n'est requis en développement
  # (CLAUDE.md §3 : « aucun service cloud obligatoire lorsque son équivalent local peut être
  # fourni »).
  storage:
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    environment:
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  kong:
    ports: !override
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${KONG_HTTP_PORT}:8000/tcp

  supavisor:
    ports: !override
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${POOLER_PROXY_PORT_SESSION}:5432
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${POOLER_PROXY_PORT_TRANSACTION}:6543

  # --- Outillage de développement ------------------------------------------------------------

  # Inspection de la base. Joint directement sur son port, jamais au travers de Kong : la
  # passerelle ne connaît donc aucun service de développement.
  studio:
    container_name: p2enjoy-studio
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./supabase/docker/volumes/snippets:/app/snippets:z
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets

  # Passerelle d'introspection du schéma, consommée uniquement par Studio.
  meta:
    container_name: p2enjoy-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # Équivalent local de S3 : le développement ne dépend d'aucun stockage objet payant.
  minio:
    container_name: p2enjoy-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT}:9000
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT}:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - minio-data:/data

  # Création idempotente du bucket des pièces jointes, par le vrai client S3.
  minio-createbucket:
    container_name: p2enjoy-minio-createbucket
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set p2enjoy http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "p2enjoy/${GLOBAL_S3_BUCKET}"

  # Puits des emails transactionnels : invitations, réinitialisations, @mentions, digest
  # (docs/JOURNAL.md décision 6). Il n'expose pas d'IMAP : le vrai serveur mail arrive en
  # CRM-050.
  inbucket:
    container_name: p2enjoy-inbucket
    image: inbucket/inbucket:stable
    restart: unless-stopped
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${INBUCKET_WEB_PORT}:9000
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${INBUCKET_SMTP_PORT}:2500
    environment:
      INBUCKET_WEB_ADDR: 0.0.0.0:9000
      INBUCKET_SMTP_ADDR: 0.0.0.0:2500
      INBUCKET_POP3_ADDR: 0.0.0.0:1100

  # Interface en développement : Vite, sources montées, rechargement à chaud (CRM-007).
  # Le build de production ne passe pas par ici : il est produit sur l'hôte par
  # `npm run build` et servi par Caddy (docker-compose.prod.yml, README.md §8).
  #
  # Les deux variables `VITE_*` sont lues **au démarrage de Vite** en développement, et
  # figées **au build** en production : c'est la même configuration, à deux moments
  # différents (docs/SPEC-webapp.md §12).
  webapp:
    container_name: p2enjoy-webapp
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${WEBAPP_DEV_PORT}:5173
    environment:
      WEBAPP_DEV_PORT: 5173
      WEBAPP_DEV_HOST: 0.0.0.0
      # L'URL est celle que le **navigateur** doit joindre, donc celle de l'hôte : un
      # `http://kong:8000` ne serait résoluble que depuis le réseau Docker.
      VITE_SUPABASE_URL: http://localhost:${KONG_HTTP_PORT}
      VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    volumes:
      - ./:/app:z
      # `node_modules` reste celui de l'image : les binaires installés dans le conteneur ne
      # doivent pas être écrasés par ceux de l'hôte, qui peuvent viser une autre plateforme.
      - webapp-node-modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:5173/').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- Messagerie de développement — CRM-050 --------------------------------------------------
  #
  # @spec CRM-050 (docs/BACKLOG.md) — infrastructure mail de développement
  # @spec docs/SPEC-mail-subsystem.md §11.2 (composants et placement), §11.8 (ports)
  #
  # Aucun de ces services n'existe en production : elle lit les serveurs des utilisateurs
  # (docs/DAT.md §3.6). Inbucket, déclaré plus haut, n'est **pas** remplacé — il reste le puits
  # des emails transactionnels, et les deux serveurs ne servent pas le même usage
  # (docs/SPEC-mail-subsystem.md §11.1).

  # Le vrai serveur IMAP/SMTP local. Sa configuration est versionnée et montée en lecture seule :
  # l'entrée par défaut de l'image écrirait sinon une configuration dont le mot de passe
  # d'administration est tiré au hasard et imprimé dans les journaux.
  stalwart:
    container_name: p2enjoy-stalwart
    image: stalwartlabs/stalwart:v0.13.4
    restart: unless-stopped
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${STALWART_SMTP_PORT}:25
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${STALWART_SUBMISSION_PORT}:587
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${STALWART_IMAP_PORT}:143
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${STALWART_ADMIN_PORT}:8080
    environment:
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD}
    volumes:
      - ./stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
      - stalwart-data:/opt/stalwart/data
    # Les quatre listeners sont éprouvés un par un, et non le seul port principal : c'est le
    # contrôle qui attrape à l'exécution la régression `[::]` décrite dans `stalwart/config.toml`,
    # laquelle laisse le conteneur `Up` sans qu'aucun port n'écoute.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - ": </dev/tcp/127.0.0.1/25 && : </dev/tcp/127.0.0.1/587 && : </dev/tcp/127.0.0.1/143 && : </dev/tcp/127.0.0.1/8080"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Provisionnement des domaines et des trois boîtes, par la **véritable API de gestion**, comme
  # le ferait un exploitant (CLAUDE.md §8). Même motif que `minio-createbucket` : un service
  # jetable qui s'arrête, et dont la sortie en succès est ce que `--wait` attend.
  #
  # L'image ne porte qu'un client HTTP : celle de Stalwart n'embarque ni `curl` ni `wget`, et son
  # `stalwart-cli` v0.13.4 n'a aucune sous-commande de gestion de compte (mesuré).
  stalwart-init:
    container_name: p2enjoy-stalwart-init
    image: curlimages/curl:8.16.0
    restart: "no"
    depends_on:
      stalwart:
        condition: service_healthy
    environment:
      STALWART_API: http://stalwart:8080
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD}
      STALWART_MAILBOX_PASSWORD: ${STALWART_MAILBOX_PASSWORD}
      CRM_INBOUND_DOMAIN: ${CRM_INBOUND_DOMAIN}
      MAIL_DEV_PERSONAL_DOMAIN: ${MAIL_DEV_PERSONAL_DOMAIN}
    volumes:
      - ./stalwart/provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]

  # Webmail de contrôle : **seul moyen de vérification visuelle** de la messagerie tant que
  # l'inbox du produit n'existe pas (CRM-057). Sa base est un SQLite interne — aucun schéma
  # supplémentaire n'est ajouté à PostgreSQL pour un outil de développement.
  roundcube:
    container_name: p2enjoy-roundcube
    image: roundcube/roundcubemail:1.6.11-apache
    restart: unless-stopped
    depends_on:
      stalwart-init:
        condition: service_completed_successfully
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${ROUNDCUBE_PORT}:80
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: stalwart
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: stalwart
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - roundcube-data:/var/roundcube/db

  # Analyse antivirale des pièces jointes entrantes (docs/DAT.md §3.4). Déclaré ici, et non dans
  # l'assemblage commun, parce que son unique consommateur — l'ingestion — arrive à `CRM-054` :
  # la production n'a rien à analyser avant elle (docs/JOURNAL.md décision 236). Le passage dans
  # `docker-compose.yml` est une opération due, inscrite dans `docs/PROD_MIGRATIONS.md` §4.
  #
  # Les signatures sont **dans l'image** : mesuré, `zINSTREAM` détecte EICAR sans qu'aucun
  # téléchargement n'ait eu lieu. `freshclam` reste tenté et échoue sans conséquence sur un
  # réseau fermé.
  clamav:
    container_name: p2enjoy-clamav
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${CLAMAV_PORT}:3310
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  minio-data:
  webapp-node-modules:
  stalwart-data:
  roundcube-data:
  clamav-data:
