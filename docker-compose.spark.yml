# @spec CRM-090 (docs/BACKLOG.md) — overlay de la cellule Spark « crm »
# @spec docs/SPEC-deploiement-spark.md §3 (assemblage), §4.2 (variables sans objet), §8 (capacité)
# @spec docs/DAT.md §3.5 (passerelle et périphérie), §9 (déploiement)
# @spec docs/JOURNAL.md décisions 567 (la cellule), 681 (MinIO depuis Chainguard, INC-290), 571 (image Realtime)
# @spec CRM-143 (docs/BACKLOG.md) — tranche T3 : ClamAV dans la cellule, son volume de signatures et son plafond
#       (docs/SPEC-pieces-jointes.md §17.2, docs/SPEC-deploiement-spark.md §3.4 et §8 ; décisions 889 et 892)
# @spec CRM-092 (docs/BACKLOG.md), docs/SPEC-session-sso.md §2 — tranche T6 : plus de limite mémoire pour
#       `auth` ni `auth-templates`, retirés de la pile (décision 589)
#
#   ./runProd.sh --spark      — jamais à la main : le script fusionne d'abord les variables
#                               injectées par le plan de contrôle (§4.1) et compose les trois
#                               fichiers dans l'ordre.
#
# Troisième fichier, appliqué par-dessus `docker-compose.yml` et `docker-compose.prod.yml`. Il ne
# porte que ce que la cellule impose :
#   - aucun port sous 1024, et TLS terminé par la Forge : Caddy sert en clair sur SPARK_HTTP_PORT ;
#   - aucun stockage objet fourni : un MinIO interne, sans port publié, que les sauvegardes savent
#     lire (scripts/backup.sh) ;
#   - 2 Gio pour toute la pile à l'origine : Kong à un seul processus nginx. *16 Go et 8 cœurs depuis le 2026-11-10*
#     (décision 889, ajout daté), et ClamAV entre dans la cellule (`CRM-143`).
#
# `env_file` n'est PAS posé sur chaque service, contrairement au gabarit du dossier de cellule :
# il remettrait tous les secrets à tous les conteneurs. L'interpolation depuis les deux mêmes
# fichiers atteint le même but, service par service (décision 567).

services:

  # --- Périphérie ----------------------------------------------------------------------------

  caddy:
    mem_limit: 128m
    # `caddy/Caddyfile.spark` ne lit ni domaine, ni adresse ACME. L'environnement hérité de l'overlay de
    # production est donc REMPLACÉ, et `CADDY_ACME_EMAIL` n'atteint rien (docs/SPEC-deploiement-spark.md §4.2).
    # Seule demeure `MCP_HOTE` (CRM-102, docs/SPEC-mcp.md §2.2) : le site `:8080` reçoit tous les hôtes de la Forge,
    # et le matcher de `routes.caddy` en sépare celui du connecteur. Un nom d'hôte public, jamais un secret ; jamais
    # vide, `mcp.invalid` à défaut.
    environment: !override
      MCP_HOTE: ${CRM_MCP_HOTE:-mcp.invalid}
    ports: !override
      - "${SPARK_HTTP_PORT}:8080"
    volumes: !override
      - ./caddy/Caddyfile.spark:/etc/caddy/Caddyfile:ro,z
      - ./caddy/routes.caddy:/etc/caddy/routes.caddy:ro,z
      - ./webapp/dist:/srv/www:ro,z
      - caddy-data:/data
      - caddy-config:/config

  # nginx démarre autant de processus que `nproc` compte de cœurs, et `nproc` décrit la Forge,
  # pas la cellule (docs/SPEC-deploiement-spark.md §2).
  kong:
    mem_limit: 256m
    environment:
      KONG_NGINX_WORKER_PROCESSES: "1"

  # --- Realtime : image dérivée ---------------------------------------------------------------
  #
  # La cellule n'accorde à `spark-docker` que les UID subordonnés 1002 à 65535 : les 3 774 fichiers
  # de `/app` que l'image d'origine attribue à `nobody` (65534) n'y sont pas extractibles, et son
  # tirage échoue (docs/JOURNAL.md décision 571). L'image dérivée, en une couche possédée par
  # `root`, est construite sur le poste et chargée dans la cellule par `scripts/spark/livrer.sh` :
  # elle n'existe dans aucun registre, et Compose ne doit donc jamais tenter de la tirer.
  realtime:
    image: p2enjoy/realtime-spark:v2.102.3
    pull_policy: never
    mem_limit: 448m

  # --- Stockage objet interne ------------------------------------------------------------------

  # L'image de Chainguard épinglée par le développement (décision 681, INC-290 : `quay.io` ne sert plus MinIO), DÉRIVÉE
  # pour la cellule (INC-329, décision 794) : celle-ci ne sait pas extraire son `nonroot` à l'UID 65532. Construite et
  # transférée par `scripts/spark/livrer.sh`, jamais tirée (`supabase/docker/minio-spark/Dockerfile`). En `root`, comme
  # l'image de `quay.io` qu'elle remplace : le volume `minio-data` lui appartient, et aucune donnée n'a à changer de
  # propriétaire. La cellule est rootless : ce `root` n'a aucun privilège sur l'hôte.
  minio:
    container_name: p2enjoy-minio
    image: p2enjoy/minio-spark:RELEASE.2026-10-23T20-06-51Z
    pull_policy: never
    user: "0:0"
    restart: always
    mem_limit: 448m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - minio-data:/data

  # Création idempotente du bucket, par le vrai client S3 — comme en développement : `mc`, que porte l'image du
  # serveur.
  minio-createbucket:
    container_name: p2enjoy-minio-createbucket
    image: p2enjoy/minio-spark:RELEASE.2026-10-23T20-06-51Z
    pull_policy: never
    user: "0:0"
    restart: "no"
    mem_limit: 64m
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set p2enjoy http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "p2enjoy/${GLOBAL_S3_BUCKET}"

  # --- Antivirus — `CRM-143` (docs/SPEC-pieces-jointes.md §17.2) ------------------------------------------------------
  #
  # LA MÊME IMAGE QUE LE DÉVELOPPEMENT, épinglée, avec la même sonde. Ses signatures vivent dans un volume nommé : un
  # redémarrage ne les retélécharge pas. Elles se mettent à jour par le `freshclam` intégré à l'image, qui doit joindre
  # `database.clamav.net` en HTTPS — le contrat de déploiement le vérifie dans un conteneur jetable AVANT le démarrage
  # (docs/PROD_MIGRATIONS.md §2.34). Aucun port publié : `mail-sync` le joint par le réseau de la pile
  # (`CLAMAV_HOST=clamav`, `docker-compose.yml`).
  #
  # LE PLAFOND, 4 Go, vaut environ le double de l'empreinte MESURÉE au pire moment, le rechargement concurrent des
  # signatures : 894 Mio au repos, environ 1,8 Gio au pic, en développement le 2026-11-10. Le rechargement garde son mode
  # concurrent : la mémoire ne manque plus, et il ne suspend pas les analyses. Sans antivirus — signatures absentes,
  # service tué —, chaque pièce naît `skipped` et le produit échoue fermé ; la reprise de `mail-sync` les analysera.
  clamav:
    container_name: p2enjoy-clamav
    image: clamav/clamav:1.4.3
    restart: always
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - clamav-data:/var/lib/clamav

  storage:
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    environment:
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  # --- Limites mémoire ------------------------------------------------------------------------
  #
  # Mesurées le 2026-09-23 sur l'assemblage de la cellule démarré à vide, migrations appliquées
  # (docs/SPEC-deploiement-spark.md §8) : environ 1 060 Mio pour la pile entière au repos. Chaque
  # limite vaut à peu près le double de l'empreinte mesurée, arrondie. Ce sont des PLAFONDS, pas des
  # réservations : leur somme dépasse les 2 Gio de la cellule, et c'est voulu. Leur rôle est de
  # rendre une défaillance LOCALISÉE et NOMMÉE — le service qui déborde est tué, pas un voisin
  # quelconque choisi par le noyau.

  db:
    mem_limit: 512m
  migrations-runner:
    mem_limit: 128m
  rest:
    mem_limit: 128m
  functions:
    mem_limit: 256m
  mail-sync:
    mem_limit: 256m

  # @spec CRM-102 (docs/BACKLOG.md), docs/SPEC-mcp.md §2.1 — sous le profil `mcp`, allumé par `CRM_MCP_HOTE`. Plafond
  # provisoire, celui de `mail-sync`, son voisin Python : à chiffrer au §8 de docs/SPEC-deploiement-spark.md après
  # mesure dans la cellule.
  mcp:
    mem_limit: 256m

volumes:
  minio-data:
  # `CRM-143` : les signatures de ClamAV, qu'un redémarrage ne retélécharge pas.
  clamav-data:
