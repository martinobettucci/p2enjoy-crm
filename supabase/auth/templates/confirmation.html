<!-- @spec CRM-009 (docs/BACKLOG.md), docs/SPEC-auth.md §5.1, docs/DESIGN_SYSTEM.md §1-3 -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmez votre adresse — P2Enjoy CRM</title>
  </head>
  <body style="margin:0;background:#F7F8FA;color:#0D0D0D;font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.55">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F7F8FA;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:14px">
          <tr><td style="padding:32px">
            <p style="margin:0 0 16px;color:#23468C;font-size:15px;font-weight:700">P2Enjoy CRM</p>
            <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25">Confirmez votre adresse email</h1>
            <p style="margin:0 0 24px;color:#374151;font-size:15px">Confirmez votre adresse email pour accéder à P2Enjoy CRM.</p>
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 24px;border-collapse:separate"><tr><td bgcolor="#23468C" style="background-color:#23468C;border-radius:8px;padding:12px 24px"><a href="{{ .ConfirmationURL }}" style="display:block;color:#FFFFFF;text-decoration:none;font-weight:700"><span style="color:#FFFFFF;font-weight:700">Confirmer mon adresse</span></a></td></tr></table>
            <p style="margin:0 0 8px;color:#4B5563;font-size:13px">Vous pouvez aussi saisir ce code à six chiffres :</p>
            <p style="margin:0;font-family:ui-monospace,monospace;font-size:20px;font-weight:700;letter-spacing:2px">{{ .Token }}</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
